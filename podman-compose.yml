version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: opb-postgres
    restart: always
    env_file:
      - ./postgres/.env
    volumes:
      - ./postgres/postgres_data:/var/lib/postgresql/data:Z
    networks:
      - opb-network
    ports:
      - "127.0.0.1:23000:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 99

  # Beatmap Fetcher Service
  osu-practice-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osu-practice-bot
    restart: always
    env_file:
      - ./src/.env.production
    networks:
      - opb-network
    security_opt:
      - label=disable

networks:
  opb-network:
    external: true
